
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>Ouça nosso trabalho</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #1c3150);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 35px 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .audio-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .play-button {
            width: 75px;
            height: 75px;
            border: none;
            border-radius: 50%;
            background: #38bdf8;
            color: #101827;
            font-size: 30px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 25px;
        }

        .play-button:hover {
            transform: scale(1.08);
            background: #7dd3fc;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 10px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 5px;
        }

        .volume {
            margin-top: 25px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .volume input {
            max-width: 130px;
            display: block;
            margin: 10px auto 0;
        }

        .footer {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
        }

        .status {
            color: #7dd3fc;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">🎧</div>

        <h1>Ouça nosso trabalho</h1>

        <p class="description">
            Aponte a câmera do seu celular para o QR Code
            e aproveite o conteúdo em áudio.
        </p>

        <div class="audio-title">
            Conteúdo em áudio
        </div>

        <audio id="audio" preload="metadata">
            <source src="SUS Para Todos.mp3" type="audio/mpeg">
            Seu navegador não suporta reprodução de áudio.
        </audio>

        <button class="play-button" id="playButton"
            aria-label="Reproduzir áudio">
            ▶
        </button>

        <div class="progress-container">

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
                aria-label="Progresso do áudio"
            >

            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

        </div>

        <div class="volume">
            Volume
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
            >
        </div>

        <p class="status" id="status">
            Pronto para reproduzir
        </p>

    </div>

    <div class="footer">
        Trabalho acadêmico
    </div>

</div>

<script>
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");
    const status = document.getElementById("status");

    function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";

        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);

        return minutes + ":" + String(secs).padStart(2, "0");
    }

    playButton.addEventListener("click", async () => {
        if (audio.paused) {
            try {
                await audio.play();
            } catch (error) {
                status.textContent = "Não foi possível reproduzir. Tente novamente.";
            }
        } else {
            audio.pause();
        }
    });

    audio.addEventListener("play", () => {
        playButton.textContent = "Ⅱ";
        playButton.setAttribute("aria-label", "Pausar áudio");
        status.textContent = "Reproduzindo áudio...";
    });

    audio.addEventListener("pause", () => {
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "Reproduzir áudio");

        if (!audio.ended) {
            status.textContent = "Áudio pausado";
        }
    });

    audio.addEventListener("loadedmetadata", () => {
        duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
            progress.value =
                (audio.currentTime / audio.duration) * 100;
        }

        currentTime.textContent = formatTime(audio.currentTime);
    });

    progress.addEventListener("input", () => {
        if (audio.duration) {
            audio.currentTime =
                (progress.value / 100) * audio.duration;
        }
    });

    volume.addEventListener("input", () => {
        audio.volume = volume.value;
    });

    audio.addEventListener("ended", () => {
        playButton.textContent = "▶";
        status.textContent = "Reprodução concluída!";
        progress.value = 0;
    });

    audio.addEventListener("error", () => {
        status.textContent = "Erro ao carregar o áudio. Verifique o arquivo.";
    });
</script>

</body>
</html>
